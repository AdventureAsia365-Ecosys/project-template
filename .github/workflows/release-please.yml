name: Release please
# Keeps a release PR open from the Conventional Commit titles merged to main; merging it tags vX.Y.Z and writes
# CHANGELOG.md (VERSIONING.md). Copier generates and updates projects from these tags.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
