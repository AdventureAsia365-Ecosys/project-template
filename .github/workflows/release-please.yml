name: Release please
# Keeps a release PR open from the Conventional Commit titles merged to main; merging it tags vX.Y.Z and writes
# CHANGELOG.md (VERSIONING.md). Copier generates and updates projects from these tags.
# The release PR is opened with a GitHub App token, not GITHUB_TOKEN: an organisation may forbid Actions from creating
# pull requests, and a PR opened by GITHUB_TOKEN does not trigger the required checks. Set the variable RELEASE_APP_ID
# and the secret RELEASE_APP_PRIVATE_KEY to turn it on; until then the job is skipped and maintainers tag by hand.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Release please
    if: vars.RELEASE_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
